name: CI

on:
  push:
  pull_request:

# De workflow leest alleen de code; geen schrijfrechten of geheimen nodig.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouwen-en-testen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type- en schemacontrole
        run: npm run check
      - name: Bouwen
        run: npm run build
      - name: Browser voor tests installeren
        run: npx playwright install --with-deps chromium
      - name: Tests (interacties, toegankelijkheid, beveiliging, vindbaarheid)
        run: npm test
      - name: Lighthouse (drempel 95 op alle categorieën)
        run: npx @lhci/cli@0.15.1 autorun
      - name: Demo-build (geanonimiseerde kopie) werkt nog
        run: npm run demo
      - name: Testrapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testresultaten
          path: |
            test-results/
            .lighthouseci-rapport/
          retention-days: 7

  # Apart van bouwen en testen: een nieuw gemelde kwetsbaarheid in een pakket is een signaal om te updaten,
  # geen fout in de wijziging zelf. Deze taak mag rood worden zonder de rest te blokkeren.
  kwetsbaarheden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high
